<script>
   /**
    *1.异步加载与渲染的问题
    *2.可以在components中直接调用这个方法注册异步组件
    *3.异步需要考虑：
    *--1.是否加载失败，是否渲染error组件
    *--2.加载时是否需要展示占位内容如：loading
    *--3.组件加载是否要200秒判断已避免loading与内容切换的闪烁
    *--4.加载失败后是否重试    
    * */
   /**
    * <template>
    *   <asyncComp />
    * </template>
    * script
    *   export default{
    *     components:{
    *        asyncComp:defineAsyncComponent(()=>import('CompA'));
    *     }
    *  }
    * script
    * 
    */

   /**
 * 定义一个异步组件
 * @param {Function} loader - 加载组件的方法，返回一个Promise
 * @returns {Object} 返回一个包装组件对象
 * @property {string} name - 组件名称
 * @property {Function} setup - 组件设置函数，返回渲染函数
 * @description 该函数用于创建异步加载的组件，在组件加载完成前渲染空文本节点
 */
function defineAsyncComponent(loader) {
      let InnerComp = null;
      return {
         name: 'AsyncComponentWrapper',
         setup() {
            const loaded = ref(false);
            loader.then((c) => {
               InnerComp = c;
               loaded.value = true;
            })
            return () => {
               return loaded.value ? {
                  type: InnerComp
               } : {
                  type: Text,
                  children: ''
               }
            }
         }
      }
   }
</script>
