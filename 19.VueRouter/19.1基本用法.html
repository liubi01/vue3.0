<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <div id="app">
        <h1>Vue Router 基本用法演示</h1>
        <nav>
            <a href="#/">首页</a> |
            <a href="#/about">关于</a> |
            <a href="#/contact">联系</a>
        </nav>
        <div id="content">
            <p>当前路径: {{ $route.path }}</p>
            <p>当前路径: {{ currentPath }}</p>
        </div>
        <button @click="navigateToAbout">跳转到关于页面</button>
    </div>
</body>

</html>
<script src="https://unpkg.com/vue@3.0.2/dist/vue.global.js"></script>
<script src="https://unpkg.com/vue-router@4.4.0/dist/vue-router.global.js"></script>
<script src="https://unpkg.com/@vue/reactivity@3.0.2/dist/reactivity.global.js"></script>

<script>
    const {
        createApp
    } = Vue;
    const {
        effect,
        unref,
        computed,
        ref,
        reactive
    } = VueReactivity;
    // const {
    //     createRouter,
    //     createWebHistory
    // } = VueRouter;
    const START_LOCATION_NORMALIZED = {
        path: '/',
        name: undefined,
        params: {},
        query: {},
        hash: '',
        fullPath: '/',
        matched: [],
        meta: {},
        redirectedFrom: undefined
    };
    const currentRoute = ref(START_LOCATION_NORMALIZED);
    
    // 定义依赖注入的键
    const routerKey = Symbol('router');
    const routeLocationKey = Symbol('route location');
    const routerViewLocationKey = Symbol('router view location');
    
    // 已安装的应用集合
    const installedApps = new Set();
    
    // 全局状态
    let pendingLocation;
    let removeHistoryListener;
    let started = false;
    let ready = false;
    
    // 工具函数
    const assign = Object.assign;
    
    const router = {
        install(app) {
            const routerHistory = window.history;

            const router = this;
            // 注册全局组件（暂时用空对象代替，实际需要实现）
            app.component('RouterLink', {});
            app.component('RouterView', {});
            
            app.config.globalProperties.$router = router;
            Object.defineProperty(app.config.globalProperties, '$route', {
                enumerable: true,
                get: () => unref(currentRoute)
            });
            
            // 创建响应式路由对象
            const reactiveRoute = {};
            for (let key in START_LOCATION_NORMALIZED) {
                reactiveRoute[key] = computed(() => {
                    return currentRoute.value[key];
                });
            }
            
            app.provide(routerKey, router);
            app.provide(routeLocationKey, reactive(reactiveRoute));
            app.provide(routerViewLocationKey, currentRoute);
            
            const unmountApp = app.unmount;
            installedApps.add(app);
            app.unmount = function () {
                installedApps.delete(app);
                if (installedApps.size < 1) {
                    pendingLocation = START_LOCATION_NORMALIZED;
                    removeHistoryListener && removeHistoryListener();
                    currentRoute.value = START_LOCATION_NORMALIZED;
                    started = false;
                    ready = false;
                }
                unmountApp();
            };
        }
    };
    // 路径管理
    // 执行一些守卫函数
    function pushWithRedirect(to, redirectedFrom) {
        // 简化的路由解析函数
        function resolve(to) {
            if (typeof to === 'string') {
                return {
                    path: to,
                    fullPath: to,
                    query: {},
                    params: {},
                    hash: '',
                    matched: [],
                    meta: {},
                    redirectedFrom: undefined
                };
            }
            return to;
        }
        
        const targetLocation = (pendingLocation = resolve(to)); // 标准化to
        const from = currentRoute.value;
        const data = to.state;
        const force = to.force;
        const replace = to.replace === true;
        
        // 目标跳转路径
        const toLocation = targetLocation;
        toLocation.redirectedFrom = redirectedFrom;
        
        let failure;
        // 简化的相同路由检查
        if (!force && from && from.path === targetLocation.path) {
            failure = new Error('Navigation duplicated');
            console.warn('Navigation duplicated');
        }
        
        // 执行跳转
        return (failure ? Promise.resolve(failure) : navigate(toLocation, from))
            .catch(error => error)
            .then((failure) => {
                if (failure) {
                    console.warn('Navigation failed:', failure);
                } else {
                    failure = finalizeNavigation(toLocation, from, true, replace, data);
                }
                return failure;
            });
    }
    
    // 简化的导航函数
    function navigate(toLocation, from) {
        return Promise.resolve(toLocation);
    }
    // 真正执行跳转操作 替换 或者 push 更新currentRoute
    function finalizeNavigation(toLocation, from, isPush, replace, data) {
        const isFirstNavigation = from === START_LOCATION_NORMALIZED;
        const state = history.state || {};
        
        if (isPush) {
            if (replace || isFirstNavigation) {
                history.replaceState(assign({
                    scroll: isFirstNavigation && state && state.scroll,
                }, data), '', toLocation.fullPath);
            } else {
                history.pushState(data, '', toLocation.fullPath);
            }
        }
        
        // 更新当前路由 - 这是关键步骤
        currentRoute.value = toLocation;
        
        // 简化的滚动处理
        if (!replace) {
            window.scrollTo(0, 0);
        }
        
        // 标记为就绪
        ready = true;
    }
    // 浏览器的history包装
    function createWebHistory(base = '') {
        // 简化的base标准化
        base = base.replace(/^\/+/, '');
        
        function normalizeBase(base) {
            return base ? `/${base}` : '';
        }
        
        function createHref(to) {
            return base ? `/${base}${to}` : to;
        }

        function go(delta, triggerListeners = true) {
            history.go(delta);
        }
        
        const routerHistory = {
            location: window.location,
            base: normalizeBase(base),
            go,
            createHref: createHref.bind(null, base),
            push: (to, data) => {
                history.pushState(data, '', createHref(to));
            },
            replace: (to, data) => {
                history.replaceState(data, '', createHref(to));
            }
        };
        
        Object.defineProperty(routerHistory, 'state', {
            enumerable: true,
            get: () => history.state
        });
        
        return routerHistory;
    }
    // 简化的历史状态导航
    function useHistoryStateNavigation(base) {
        const { history, location } = window;
        
        // 创建当前位置
        function createCurrentLocation(base, location) {
            const path = location.pathname;
            return base ? path.replace(new RegExp(`^${base}`), '') || '/' : path;
        }
        
        const currentLocation = {
            value: createCurrentLocation(base, location)
        };
        
        const historyState = {
            value: history.state
        };
        
        // 初始化历史状态
        if (!historyState.value) {
            const initialState = {
                back: null,
                current: currentLocation.value,
                forward: null,
                position: history.length - 1,
                replaced: true,
                scroll: null,
            };
            
            history.replaceState(initialState, '', location.href);
            historyState.value = initialState;
        }

        function changeLocation(to, state, replace) {
            const url = base ? `/${base}${to}` : to;
            try {
                history[replace ? 'replaceState' : 'pushState'](state, '', url);
                historyState.value = state;
            } catch (err) {
                console.warn('History state change failed:', err);
                location[replace ? 'replace' : 'assign'](url);
            }
        }

        function replace(to, data) {
            const state = assign({}, historyState.value, data, {
                position: historyState.value.position
            });
            changeLocation(to, state, true);
        }
        
        function push(to, data) {
            const currentState = assign({}, historyState.value, {
                forward: to,
                scroll: { left: window.pageXOffset, top: window.pageYOffset }
            });
            
            changeLocation(currentState.current, currentState, true);
            
            const newState = assign({}, {
                back: currentState.current,
                current: to,
                forward: null,
                position: currentState.position + 1
            }, data);
            
            changeLocation(to, newState, false);
            currentLocation.value = to;
        }
        
        return {
            location: currentLocation,
            state: historyState,
            push,
            replace
        };
    }
    
    // 创建应用实例
    const app = createApp({
        data() {
            return {
                currentPath: window.location.pathname
            };
        },
        methods: {
            navigateToAbout() {
                // 使用router的push方法进行导航
                if (this.$router && this.$router.push) {
                    this.$router.push('/about');
                } else {
                    // 简单的hash路由实现
                    window.location.hash = '#/about';
                }
            }
        },
        mounted() {
            // 监听路由变化
            window.addEventListener('hashchange', () => {
                this.currentPath = window.location.hash.slice(1) || '/';
            });
        }
    });
    
    // 安装路由插件
    app.use(router);
    
    // 挂载应用
    app.mount('#app');
</script>
